name: Temporary all remaining scene materials

on:
  push:
    paths:
      - '.github/workflows/tmp-all-scenes-materials.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          python -m pip install -U yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip

      - name: Collect materials
        shell: bash
        run: |
          set -u
          ROOT='fourth_wall_materials'
          rm -rf "$ROOT"
          mkdir -p "$ROOT"/{01_hifi,02_mgs,03_light_meta,04_resetti,05_daily_life,06_gaze_research,07_nier_camera,08_mirror_research,09_mother2,10_totono_nier_end,11_sources}

          dlimg() {
            url="$1"; out="$2"
            echo "IMAGE $out"
            curl -fL --retry 3 --connect-timeout 15 -A 'Mozilla/5.0 Chrome/124 Safari/537.36' "$url" -o "$out" || true
          }

          clipsearch() {
            query="$1"; slug="$2"; dir="$3"
            echo "VIDEO $slug :: $query"
            mkdir -p "$ROOT/$dir/tmp_$slug"
            meta="$ROOT/$dir/${slug}_source.txt"
            yt-dlp "ytsearch1:${query}" --no-playlist --match-filter "duration > 5 & duration < 900" \
              --print "title=%(title)s\nurl=%(webpage_url)s\nuploader=%(uploader)s\nduration=%(duration)s" \
              > "$meta" 2>/dev/null || true
            yt-dlp "ytsearch1:${query}" --no-playlist --match-filter "duration > 5 & duration < 900" \
              -f 'bv*[height<=480]+ba/b[height<=480]' --merge-output-format mp4 \
              --download-sections '*0-45' --force-keyframes-at-cuts \
              -o "$ROOT/$dir/tmp_$slug/source.%(ext)s" || true
            f=$(find "$ROOT/$dir/tmp_$slug" -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.mkv' \) | head -1)
            if [ -n "${f:-}" ]; then
              ffmpeg -y -hide_banner -loglevel error -i "$f" -t 45 -vf 'scale=-2:480,fps=30' -c:v libx264 -preset veryfast -crf 24 -c:a aac -b:a 96k "$ROOT/$dir/${slug}_candidate_45s.mp4" || true
              ffmpeg -y -hide_banner -loglevel error -i "$ROOT/$dir/${slug}_candidate_45s.mp4" -vf 'fps=1/2,scale=320:-1,tile=5x4' -frames:v 2 "$ROOT/$dir/${slug}_sheet_%02d.jpg" || true
            fi
            rm -rf "$ROOT/$dir/tmp_$slug"
          }

          # 01 Hi-Fi RUSH: meta dialogue + supporting stills
          clipsearch 'Hi-Fi RUSH Zanzo lab interrupted pause hideout dialogue Macaron Peppermint' 'hifi_meta_dialogue' '01_hifi'
          dlimg 'https://cdn.mos.cms.futurecdn.net/jQAgDRRnMC9gKGmwvGfBdQ.jpg' "$ROOT/01_hifi/hifi_hideout.jpg"
          dlimg 'https://wp-uploads.qualbert.com/2023/02/20230126150545_1-1024x576.jpg' "$ROOT/01_hifi/hifi_peppermint_chai.jpg"

          # 02 MGS Psycho Mantis
          clipsearch 'Metal Gear Solid Psycho Mantis memory card Tokimeki Memorial scene Japanese' 'mgs_psycho_mantis_memory' '02_mgs'
          dlimg 'https://cdn.mobygames.com/screenshots/141049-metal-gear-solid-windows-psycho-mantis-can-use-his-telekinesis-t.jpg' "$ROOT/02_mgs/psycho_mantis_battle.jpg"
          dlimg 'https://www.svg.com/img/gallery/video-game-bosses-that-make-us-rage/psycho-mantis-from-metal-gear-solid.jpg' "$ROOT/02_mgs/psycho_mantis_floating.jpg"
          curl -fL --retry 3 'https://www.konami.com/mg/archive/mgs/character/ch11.html' -o "$ROOT/02_mgs/konami_psycho_mantis_official.html" || true

          # 03 Light/comedic meta: Gintama + Kid Icarus
          clipsearch '銀魂 メタ発言 アニメ 制作費 第四の壁' 'gintama_meta' '03_light_meta'
          clipsearch '新 光神話 パルテナの鏡 メタ発言 ゲームシステム' 'kid_icarus_meta' '03_light_meta'

          # 04 Animal Crossing / Resetti
          clipsearch 'どうぶつの森 リセットさん リセット 説教 初代' 'resetti_scolding' '04_resetti'
          curl -fL --retry 3 'https://www.nintendo.co.jp/wii/ruuj/character/village_visitor.html' -o "$ROOT/04_resetti/nintendo_resetti_official.html" || true
          dlimg 'https://assets.st-note.com/production/uploads/images/245896828/picture_pc_6e5465787cd183c59645269b78c04f4a.png?width=1200' "$ROOT/04_resetti/resetti_dialogue_modern.png"

          # 05 Daily-life analogy
          dlimg 'https://publish.purewow.net/wp-content/uploads/sites/2/2024/05/living-alone-for-the-first-time-photo-of-a-woman-dancing-in-her-apartment.jpg?fit=2050%2C1326' "$ROOT/05_daily_life/dancing_alone.jpg"
          dlimg 'https://www.zdf.de/assets/ich-dich-auch3-buehnen-100~1920x1080?cb=1769695814973' "$ROOT/05_daily_life/sudden_intrusion_surprise.jpg"
          dlimg 'https://fashionsnap-assets.com/asset/format%3Dauto%2Cwidth%3D1200/article/images/2026/02/imgi_4_6f5fc567-53e9e565-64cd-4dc2-be13-aefec52baf5e.jpg' "$ROOT/05_daily_life/self_checkout_monitoring.jpg"

          # 06 Audience/gaze research sources
          curl -fL --retry 3 'https://pubmed.ncbi.nlm.nih.gov/6356198/' -o "$ROOT/06_gaze_research/bond_titus_social_facilitation_pubmed.html" || true
          curl -fL --retry 3 'https://royalsocietypublishing.org/doi/pdf/10.1098/rsbl.2006.0509' -o "$ROOT/06_gaze_research/bateson_watching_eyes_2006.pdf" || true
          curl -fL --retry 3 'https://pubmed.ncbi.nlm.nih.gov/17148417/' -o "$ROOT/06_gaze_research/bateson_watching_eyes_pubmed.html" || true

          # 07 NieR camera reaction
          clipsearch 'NieR Automata 2B camera angle reaction skirt shoos player away' 'nier_2b_camera_reaction' '07_nier_camera'
          dlimg 'https://images.igdb.com/igdb/image/upload/t_screenshot_big/sc943e.jpg' "$ROOT/07_nier_camera/nier_2b_pod.jpg"
          dlimg 'https://jogorama.com.br/arquivos/noticias/2016/nier-automata-16.jpg' "$ROOT/07_nier_camera/nier_2b_gameplay.jpg"

          # 08 Mirror / self-awareness research
          curl -fL --retry 3 'https://pubmed.ncbi.nlm.nih.gov/512839/' -o "$ROOT/08_mirror_research/beaman_halloween_mirror_pubmed.html" || true
          curl -fL --retry 3 'https://www.sciencedirect.com/science/article/pii/0022103171900321/pdf' -o "$ROOT/08_mirror_research/duval_wicklund_self_awareness_preview.pdf" || true
          cp "$ROOT/05_daily_life/self_checkout_monitoring.jpg" "$ROOT/08_mirror_research/self_checkout_monitoring.jpg" 2>/dev/null || true

          # 09 MOTHER2
          clipsearch 'MOTHER2 ギーグ 最後の祈り プレイヤー 名前' 'mother2_final_prayer' '09_mother2'
          dlimg 'https://s.inside-games.jp/imgs/p/XDbCbghKzVCeRs9WXItNCQoLUAcGBQQDAgEA/717221.jpg?zoom=spacing' "$ROOT/09_mother2/mother2_prayer.jpg"
          curl -fL --retry 3 'https://www.nintendo.com/en-gb/Games/Super-Nintendo/EarthBound-771110.html' -o "$ROOT/09_mother2/nintendo_earthbound_official.html" || true

          # 10 Totono + NieR save-data endings
          clipsearch '君と彼女と彼女の恋 美雪 メニュー セーブデータ 消される' 'totono_meta_save' '10_totono_nier_end'
          clipsearch 'NieR Automata Ending E delete save data sacrifice scene' 'nier_ending_e_delete_save' '10_totono_nier_end'
          curl -fL --retry 3 'https://www.nitroplus.co.jp/game/totono/interview/05.php' -o "$ROOT/10_totono_nier_end/totono_official_interview_meta.html" || true
          curl -fL --retry 3 'https://www.nitroplus.co.jp/support/sp25/sp25b/11953.php' -o "$ROOT/10_totono_nier_end/totono_official_save_support.html" || true

          # Make compact source/usage manifest
          cat > "$ROOT/11_sources/SOURCES.md" <<'EOF'
          # 第四の壁動画・残り素材パック

          ## 使い方
          - `*_candidate_45s.mp4`: 目的場面を探すための短い引用候補。最終編集では必要な数秒だけ再切り出し推奨。
          - `*_sheet_*.jpg`: 上記候補のコンタクトシート。
          - `.html/.pdf`: 研究・公式根拠確認用。画面に出す場合はタイトル等の必要箇所だけ。
          - 静止画は出典元の権利条件を個別確認し、批評・解説に必要な範囲で使用。

          ## 台本対応
          01 Hi-Fi RUSH — 「ゲーム自身について話すが怖くない」
          02 MGS — サイコ・マンティス／プレイヤーの趣味・メモリーカード
          03 銀魂・新パルテナ — 軽いメタネタ
          04 どうぶつの森 — リセットさん／ゲーム外操作を知る
          05 日常比喩 — 一人で踊る→見られていた、セルフレジ監視
          06 視線・観客効果 — Bond & Titus (1983), Bateson et al. (2006)
          07 NieR:Automata — 2Bのカメラ反応
          08 鏡・自己意識 — Beaman et al. (1979), Duval/Wicklund系
          09 MOTHER2 — 最後の祈り／プレイヤー名
          10 ととの。・NieR — セーブデータやゲーム外操作を物語化

          ## 主要Web出典
          - KONAMI Psycho Mantis official: https://www.konami.com/mg/archive/mgs/character/ch11.html
          - Nintendo Resetti official character page: https://www.nintendo.co.jp/wii/ruuj/character/village_visitor.html
          - Nintendo EarthBound official: https://www.nintendo.com/en-gb/Games/Super-Nintendo/EarthBound-771110.html
          - Nitroplus Totono interview Vol.5: https://www.nitroplus.co.jp/game/totono/interview/05.php
          - Beaman et al. 1979 PubMed: https://pubmed.ncbi.nlm.nih.gov/512839/
          - Bond & Titus 1983 PubMed: https://pubmed.ncbi.nlm.nih.gov/6356198/
          - Bateson et al. 2006 PubMed: https://pubmed.ncbi.nlm.nih.gov/17148417/
          EOF

          find "$ROOT" -type f -size 0 -delete || true
          find "$ROOT" -type f -maxdepth 3 -printf '%p\t%k KB\n' | sort > "$ROOT/11_sources/FILE_LIST.txt"
          du -sh "$ROOT"

      - name: Package
        run: zip -r fourth_wall_remaining_materials.zip fourth_wall_materials

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: fourth-wall-remaining-materials
          path: fourth_wall_remaining_materials.zip
          retention-days: 2

      - name: Publish marker
        shell: bash
        run: |
          printf 'run_id=%s\nartifact_id=%s\n' "$GITHUB_RUN_ID" '${{ steps.upload.outputs.artifact-id }}' > fourth_wall_materials_marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fourth_wall_materials_marker.txt
          git commit -m 'Temporary fourth wall materials marker [skip ci]' || true
          git push
