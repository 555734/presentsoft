name: Fetch Sadako assets temporary

on:
  push:
    paths:
      - '.github/workflows/fetch-sadako-assets.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download selected assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sadako_assets
          download() {
            local url="$1"
            local out="$2"
            echo "Downloading $out"
            curl -fL --retry 3 --retry-delay 2 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36' \
              "$url" -o "sadako_assets/$out"
          }
          download 'https://media.eiga.com/images/buzz/111966/ac75fe446f23d90b/640.jpg' '01_tv_emergence_eiga.jpg'
          download 'https://livedoor.4.blogimg.jp/nwknews/imgs/4/9/491d384a-s.jpg' '02_eye_closeup.jpg'
          download 'https://morbidlybeautiful.com/wp-content/uploads/2020/10/ringu.jpg' '03_sadako_well_forest.jpg'
          download 'https://amherstcinema.org/sites/default/files/styles/field_image_front/public/RinguWeb4.jpg?itok=oYvgxQRR' '04_looking_into_well.jpg'
          download 'https://m.media-amazon.com/images/M/MV5BZDNiN2JiZTYtMjI3OC00OWIyLWI2ZTMtYzBjNDIwNWY2NGE2XkEyXkFqcGc%40._V1_.jpg' '05_reiko_tv_scene.jpg'
          download 'https://image.pmgstatic.com/cache/resized/w663/files/images/film/photos/158/080/158080913_c00dc8.jpg' '06_sadako_standing_room.jpg'
          download 'https://horror2.jp/files/2019/02/sadako_teaser-1-724x1024.jpg' '07_sadako_2019_teaser.jpg'
          download 'https://img.youtube.com/vi/mVtcKz7afuM/maxresdefault.jpg' '08_sadako_2019_trailer_frame.jpg'
          download 'https://focus.telerama.fr/2022/02/24/107/0/4184/2789/1600/1067/60/0/5d6adba_1645688212021-ring-1998-01-rmiptc.jpg' '09_cursed_vhs_tape.jpg'
          download 'https://spoilertown.com/wp-content/uploads/2025/10/ringu-1998.webp' '10_sadako_blue_well.webp'
          file sadako_assets/*

      - name: Write source manifest
        shell: bash
        run: |
          cat > sadako_assets/SOURCES.md <<'EOF'
          # Sadako / Ring reference assets
          1. 01_tv_emergence_eiga.jpg — https://eiga.com/news/20240818/12/
          2. 02_eye_closeup.jpg — image indexed from livedoor blog
          3. 03_sadako_well_forest.jpg — https://morbidlybeautiful.com/isoyp-ringu-vs-the-ring/
          4. 04_looking_into_well.jpg — https://amherstcinema.org/films-and-events/ringu
          5. 05_reiko_tv_scene.jpg — https://www.imdb.com/title/tt0178868/
          6. 06_sadako_standing_room.jpg — CSFD image CDN
          7. 07_sadako_2019_teaser.jpg — https://horror2.jp/28133
          8. 08_sadako_2019_trailer_frame.jpg — YouTube trailer thumbnail indexed by MANTANWEB
          9. 09_cursed_vhs_tape.jpg — https://www.telerama.fr/cinema/films/ring%2C5126.php
          10. 10_sadako_blue_well.webp — https://spoilertown.com/ringu-1998/

          Copyright note: film/promotional images remain copyrighted unless explicitly stated otherwise. Use only as necessary for commentary/criticism and confirm the requirements for the final publication.
          EOF

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadako-assets
          path: sadako_assets
          if-no-files-found: error
          retention-days: 7
