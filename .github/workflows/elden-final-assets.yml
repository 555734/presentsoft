name: Elden Ring Final Assets

on:
  push:
    branches: [chatgpt/elden-runner]
    paths:
      - '.github/workflows/elden-final-assets.yml'
      - 'elden-final-assets-trigger.txt'
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq fonts-noto-cjk
          python3 -m pip install --break-system-packages -U yt-dlp
          mkdir -p pack/video pack/audio pack/audit

      - name: Download real Elden Ring gameplay from Bilibili
        run: |
          set -u
          fetch_bili() {
            name="$1"; url="$2"; sec="$3"
            echo "===== $name $url ====="
            yt-dlp --no-playlist \
              --download-sections "*0-${sec}" --force-keyframes-at-cuts \
              -f 'bv*[height<=480]+ba/b[height<=480]/b' \
              --merge-output-format mp4 \
              -o "pack/video/${name}.%(ext)s" "$url" || return 1
            f=$(find pack/video -maxdepth 1 -type f -name "${name}.*" | head -1)
            [ -n "$f" ] || return 1
            ffmpeg -y -loglevel error -i "$f" -an -vf "scale='min(854,iw)':-2,fps=30" -c:v libx264 -crf 20 -preset veryfast -pix_fmt yuv420p "pack/video/${name}_norm.mp4"
          }

          # Launch-era Hoarfrost Stomp demo/guide. Description explicitly says it can carry through bosses.
          fetch_bili hoarfrost 'https://www.bilibili.com/video/BV1m34y1k7g9/' 120 || true
          # Mimic Tear guide/demo, explicitly showing the powerful spirit ash.
          fetch_bili mimic 'https://www.bilibili.com/video/BV1Uq4y1v7He/' 120 || true
          # Let Me Solo Her retrospective containing actual LMSH/Malenia footage.
          fetch_bili lmsh 'https://www.bilibili.com/video/BV1cZ4y127Kd/' 120 || true
          # Exact launch-era Volcano Manor 50-hit hidden wall clip.
          fetch_bili wall50 'https://www.bilibili.com/video/BV1Fu411q768/' 90 || true

          find pack/video -type f -printf '%f|%s\n' | sort
          test -s pack/video/hoarfrost_norm.mp4
          test -s pack/video/mimic_norm.mp4
          test -s pack/video/lmsh_norm.mp4
          test -s pack/video/wall50_norm.mp4

      - name: Generate exact VOICEVOX Shikoku Metan narration
        run: |
          set -eux
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:50021/version && break || true
            sleep 2
          done
          curl -fsS http://127.0.0.1:50021/speakers > pack/audio/speakers.json
          cat > pack/audio/script.txt <<'TXT'
          エルデンリングの発売初期の狂気がヤバい。2022年に発売され、世界中で大ヒットした今作ですが、初期のゲーム環境はまさに狂気の沙汰でした。まず猛威を振るったのが戦技「霜踏み」。どんな強力なボスも、足をバタバタ踏み鳴らすだけであっさり溶けていくため、当時はフロム史上最強の足踏み状態。世界中で謎の足踏みラッシュが発生しました。さらに、自分とほぼ同じ分身を呼び出す「写し身の雫」に至っては、プレイヤー本人が後ろで見守る中、分身がボスをボコボコにするという主客転倒な事態が多発。作中最強クラスのボス「マレニア」の召喚サイン前には、頭に壺を被った裸同然の男「Let Me Solo Her」が現れ、ほぼノーダメージで倒し続け世界的な英雄に。後にはバンダイナムコから、記念品として本物の剣まで贈られました。極めつけは「この先、隠し道があるぞ」という嘘メッセージ。壁を叩き続ける褪せ人が続出する中、発売初期には本当に数十回叩くと消える異常な壁が火山館で発見。後のアップデートで修正されました。
          TXT
          curl -fsS -X POST 'http://127.0.0.1:50021/audio_query?speaker=2' \
            --get --data-urlencode text@pack/audio/script.txt > pack/audio/query_raw.json
          jq '.speedScale=1.22 | .pitchScale=0 | .intonationScale=1.0 | .volumeScale=1.0 | .postPhonemeLength=0.08' \
            pack/audio/query_raw.json > pack/audio/query.json
          curl -fsS -H 'Content-Type: application/json' -X POST \
            -d @pack/audio/query.json 'http://127.0.0.1:50021/synthesis?speaker=2' > pack/audio/metan.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1 pack/audio/metan.wav
          test -s pack/audio/metan.wav

      - name: Build visual audit sheets
        run: |
          set -eux
          for f in pack/video/*_norm.mp4; do
            b=$(basename "$f" _norm.mp4)
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            python3 - "$dur" > /tmp/times.txt <<'PY'
          import sys
          d=max(float(sys.argv[1]),1.0)
          print(' '.join(f'{d*x:.3f}' for x in (0.05,0.15,0.25,0.35,0.45,0.55,0.65,0.75,0.85,0.95)))
          PY
            i=0
            for t in $(cat /tmp/times.txt); do
              ffmpeg -y -loglevel error -ss "$t" -i "$f" -frames:v 1 -vf 'scale=320:-2' "pack/audit/${b}_${i}.jpg" || true
              i=$((i+1))
            done
          done
          ffmpeg -y -loglevel error -pattern_type glob -i 'pack/audit/*.jpg' \
            -vf 'scale=320:-2,tile=5x8:padding=4:margin=4' -frames:v 1 pack/audit/contact_sheet.jpg || true

      - uses: actions/upload-artifact@v4
        with:
          name: elden-final-real-assets
          path: pack/
          compression-level: 0
          retention-days: 7
