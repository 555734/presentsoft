name: Temporary Aivis fourth-wall narration v3
on:
  push:
    paths:
      - '.github/workflows/tmp-aivis-fourthwall-tts-v3.yml'
permissions:
  contents: write
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id immediately
        run: |
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" > aivis_v3_run_marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aivis_v3_run_marker.txt
          git commit -m 'Aivis v3 run marker [skip ci]'
          git push
      - name: Install helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          python -m pip install -q requests
      - name: Start AivisSpeech Engine
        run: |
          docker pull ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          docker run --rm -d --name aivis_engine -p 10101:10101 ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          ok=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:10101/version >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsS http://127.0.0.1:10101/version
      - name: Install narration model
        run: |
          MODEL_UUID='47e53151-a378-46f3-abee-ce13aa07feb1'
          curl -fsS -X POST 'http://127.0.0.1:10101/aivm_models/install' \
            -F "url=https://api.aivis-project.com/v1/aivm-models/${MODEL_UUID}/download?model_type=AIVMX"
          curl -fsS http://127.0.0.1:10101/speakers > speakers.json
          jq '.[] | select(.name=="阿井田 茂")' speakers.json
      - name: Synthesize
        run: |
          cat > synthesize.py <<'PY'
          import json, wave
          from pathlib import Path
          import requests
          B='http://127.0.0.1:10101'
          segs=json.load(open('tmp_aivis_segments.json',encoding='utf-8'))
          speakers=requests.get(B+'/speakers',timeout=30).json()
          target=next(s for s in speakers if s.get('name')=='阿井田 茂')
          style=next((x for x in target['styles'] if x.get('name')=='Calm'), target['styles'][0])
          sid=style['id']
          out=Path('aivis_v3'); out.mkdir(exist_ok=True)
          timings=[]; cursor=0.0; files=[]
          def dur(p):
              with wave.open(str(p),'rb') as w: return w.getnframes()/w.getframerate()
          def silence(p,sec=1.15,rate=44100):
              with wave.open(str(p),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(b'\0\0'*int(rate*sec))
          for i,x in enumerate(segs):
              p=out/f'{i:03d}.wav'
              if x['display']=='……。':
                  silence(p)
              else:
                  q=requests.post(B+'/audio_query',params={'speaker':sid,'text':x['spoken']},timeout=120); q.raise_for_status()
                  a=q.json(); a['speedScale']=1.08; a['intonationScale']=0.94; a['tempoDynamicsScale']=1.0; a['pitchScale']=0.0; a['volumeScale']=1.0; a['prePhonemeLength']=0.05; a['postPhonemeLength']=0.14
                  r=requests.post(B+'/synthesis',params={'speaker':sid},json=a,timeout=180); r.raise_for_status(); p.write_bytes(r.content)
              d=dur(p); timings.append({'index':i,'start':cursor,'end':cursor+d,'duration':d,**x}); cursor+=d; files.append(p)
              print(f'{i:02d} {d:.2f}s {x["spoken"][:42]}')
          (out/'concat.txt').write_text(''.join(f"file '{p.name}'\n" for p in files),encoding='utf-8')
          json.dump(timings,open(out/'timings.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          (out/'VOICE_INFO.txt').write_text('AivisSpeech Engine\nModel: 阿井田 茂 / Calm\nArchitecture: Style-Bert-VITS2 JP-Extra\nPronunciation layer: explicit\n',encoding='utf-8')
          print('TOTAL',cursor)
          PY
          python synthesize.py
          (cd aivis_v3 && ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i concat.txt -c:a pcm_s16le narration.wav)
          ffmpeg -y -hide_banner -loglevel error -i aivis_v3/narration.wav -c:a aac -b:a 192k aivis_v3/narration.m4a
      - name: Upload
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: fourthwall-aivis-v3
          path: |
            aivis_v3/narration.m4a
            aivis_v3/timings.json
            aivis_v3/VOICE_INFO.txt
            tmp_aivis_segments.json
          retention-days: 2
      - name: Publish artifact id
        run: |
          printf 'run_id=%s\nartifact_id=%s\n' "$GITHUB_RUN_ID" '${{ steps.up.outputs.artifact-id }}' > aivis_v3_artifact_marker.txt
          git pull --rebase
          git add aivis_v3_artifact_marker.txt
          git commit -m 'Aivis v3 artifact marker [skip ci]' || true
          git push
