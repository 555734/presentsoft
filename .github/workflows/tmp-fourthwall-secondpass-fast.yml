name: Temporary fourth wall second-pass fast
on:
  push:
    paths: ['.github/workflows/tmp-fourthwall-secondpass-fast.yml']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip
      - name: Download
        shell: bash
        run: |
          set -u
          R=secondpass; rm -rf "$R"; mkdir -p "$R"/{02_mgs,03_light_meta,04_resetti,07_nier_camera,09_mother2,10_totono_nier_end}
          d(){ curl -fL --max-time 8 --connect-timeout 5 -A 'Mozilla/5.0' "$1" -o "$2" || rm -f "$2"; }
          d 'https://blog-imgs-29.fc2.com/a/r/a/araragi1028/P1000554.jpg' "$R/03_light_meta/gintama_production_cost_meta.jpg"
          d 'https://assets.st-note.com/img/1711091166943-2D49APAj7x.jpg' "$R/03_light_meta/kid_icarus_dialogue.jpg"
          d 'https://pinion.jp/webp.php/2025/02/%E3%83%A1%E3%82%BF%E3%83%AB%E3%82%AE%E3%82%A2%E3%82%BD%E3%83%AA%E3%83%83%E3%83%89_%E3%82%B5%E3%82%A4%E3%82%B3%E3%83%9E%E3%83%B3%E3%83%86%E3%82%A3%E3%82%B9-1024x535.jpg' "$R/02_mgs/psycho_mantis_tokimemo_quote.jpg"
          d 'https://i.kym-cdn.com/photos/images/original/001/335/711/aa6.jpg' "$R/02_mgs/psycho_mantis_memory_card.jpg"
          d 'https://fantasystudy.com/wp-content/uploads/2020/12/EpmP12NU0AAMa7Q-300x180.jpg' "$R/04_resetti/resetti_scolding_01.jpg"
          d 'https://fantasystudy.com/wp-content/uploads/2020/12/EpmP8M-UUAAsty6-300x180.jpg' "$R/04_resetti/resetti_scolding_02.jpg"
          d 'https://fantasystudy.com/wp-content/uploads/2020/12/EpmQ4XEVQAMXkF2-300x180.jpg' "$R/04_resetti/resetti_scolding_03.jpg"
          d 'https://i.imgur.com/6YCACtE.gif' "$R/07_nier_camera/2b_camera_swat.gif"
          [ -s "$R/07_nier_camera/2b_camera_swat.gif" ] && ffmpeg -y -hide_banner -loglevel error -i "$R/07_nier_camera/2b_camera_swat.gif" -pix_fmt yuv420p -vf 'scale=trunc(iw/2)*2:trunc(ih/2)*2,fps=30' "$R/07_nier_camera/2b_camera_swat.mp4" || true
          d 'https://assets.st-note.com/img/1744335621-VNOnlaivw9uEyxTzPZMAqFe0.jpg?width=1200' "$R/09_mother2/player_name_entry.jpg"
          d 'https://blog-imgs-153-origin.fc2.com/s/s/x/ssxzero/Mother2-345.jpg' "$R/09_mother2/final_prayer_player_01.jpg"
          d 'https://blog-imgs-153-origin.fc2.com/s/s/x/ssxzero/Mother2-346.jpg' "$R/09_mother2/final_prayer_player_02.jpg"
          d 'https://blog-imgs-153-origin.fc2.com/s/s/x/ssxzero/Mother2-347.jpg' "$R/09_mother2/final_prayer_resolution.jpg"
          d 'https://rit.su/img/img_play_title.jpg' "$R/10_totono_nier_end/totono_title_official.jpg"
          d 'https://rit.su/img/img_play_game-menu.jpg' "$R/10_totono_nier_end/totono_menu_official.jpg"
          d 'https://rit.su/img/img_play_save.jpg' "$R/10_totono_nier_end/totono_save_load_official.jpg"
          d 'https://withaterriblefate.com/wp-content/uploads/2021/01/word-image.png' "$R/10_totono_nier_end/nier_e_delete_confirmation.jpg"
          d 'https://withaterriblefate.com/wp-content/uploads/2021/01/word-image-14.png' "$R/10_totono_nier_end/nier_e_rescue_offer.jpg"
          d 'https://withaterriblefate.com/wp-content/uploads/2021/01/word-image-15.png' "$R/10_totono_nier_end/nier_e_save_sacrifice.jpg"
          d 'https://withaterriblefate.com/wp-content/uploads/2021/01/word-image-16.png' "$R/10_totono_nier_end/nier_e_message.jpg"
          find "$R" -type f -printf '%P\t%k KB\n' | sort > "$R/FILE_LIST.txt"
          zip -r secondpass.zip "$R"
      - name: Upload
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: fourthwall-secondpass-fast
          path: secondpass.zip
          retention-days: 2
      - name: marker
        run: |
          printf 'run_id=%s\nartifact_id=%s\n' "$GITHUB_RUN_ID" '${{ steps.up.outputs.artifact-id }}' > fourthwall_secondpass_fast_marker.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fourthwall_secondpass_fast_marker.txt && git commit -m 'Temporary fast second-pass marker [skip ci]' && git push
