name: Temporary Masaru multilingual narration
on:
  push:
    paths:
      - '.github/workflows/tmp-masaru-fourthwall-tts.yml'
permissions:
  contents: write
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: marker
        run: |
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" > masaru_run_marker.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masaru_run_marker.txt && git commit -m 'Masaru run marker [skip ci]' && git push
      - run: python -m pip install -q edge-tts
      - name: synthesize
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python - <<'PY'
          import json, subprocess, pathlib, wave, os
          segs=json.load(open('tmp_aivis_segments.json',encoding='utf-8'))
          out=pathlib.Path('masaru'); out.mkdir(exist_ok=True)
          timing=[]; cursor=0.0; paths=[]
          for i,x in enumerate(segs):
              p=out/f'{i:03d}.mp3'
              if x['display']=='……。':
                  subprocess.run(['ffmpeg','-y','-hide_banner','-loglevel','error','-f','lavfi','-i','anullsrc=r=24000:cl=mono','-t','1.15','-q:a','7',str(p)],check=True)
              else:
                  subprocess.run(['edge-tts','--voice','ja-JP-MasaruMultilingualNeural','--rate=+10%','--text',x['spoken'],'--write-media',str(p)],check=True)
              dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(p)]))
              timing.append({'index':i,'start':cursor,'end':cursor+dur,'duration':dur,**x}); cursor+=dur; paths.append(p)
          (out/'concat.txt').write_text(''.join(f"file '{p.name}'\n" for p in paths),encoding='utf-8')
          json.dump(timing,open(out/'timings.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('TOTAL',cursor)
          PY
          (cd masaru && ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i concat.txt -c:a aac -b:a 192k narration.m4a)
      - name: upload
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: fourthwall-masaru-multilingual
          path: |
            masaru/narration.m4a
            masaru/timings.json
            tmp_aivis_segments.json
          retention-days: 2
      - name: artifact marker
        run: |
          printf 'run_id=%s\nartifact_id=%s\n' "$GITHUB_RUN_ID" '${{ steps.up.outputs.artifact-id }}' > masaru_artifact_marker.txt
          git pull --rebase
          git add masaru_artifact_marker.txt && git commit -m 'Masaru artifact marker [skip ci]' && git push
