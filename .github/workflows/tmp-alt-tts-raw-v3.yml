name: Temporary raw alternative TTS samples v3
on:
  push:
    paths:
      - '.github/workflows/tmp-alt-tts-raw-v3.yml'
permissions:
  contents: write
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id
        run: |
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" > alt_tts_v3_run_marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alt_tts_v3_run_marker.txt
          git commit -m 'Alt TTS v3 run marker [skip ci]'
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install -q --upgrade pip
          python -m pip install -q 'numpy<2' soundfile 'kokoro>=0.9.4' 'misaki[ja]' git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
          mkdir -p samples
      - name: Synthesize all voices
        run: |
          python - <<'PY'
          import numpy as np, soundfile as sf
          from kokoro import KPipeline
          from melo.api import TTS
          text='ゲームにも、これと少し似た瞬間があります。キャラクターがゲームの外にいるプレイヤーへ触れてくる時です。どちらも、だいよんのかべを破る演出です。なのに、片方は笑えて、片方は不気味です。'
          pipe=KPipeline(lang_code='j')
          for voice,out in [('jm_kumo','samples/01_kokoro_kumo_raw.wav'),('jf_alpha','samples/02_kokoro_alpha_raw.wav')]:
              chunks=[]
              for _,_,audio in pipe(text, voice=voice, speed=1.0):
                  chunks.append(np.asarray(audio,dtype=np.float32))
              if not chunks: raise RuntimeError('Kokoro produced no audio for '+voice)
              sf.write(out,np.concatenate(chunks),24000)
          model=TTS(language='JP',device='cpu')
          model.tts_to_file(text,model.hps.data.spk2id['JP'],'samples/03_melotts_jp_raw.wav',speed=1.02,quiet=True)
          PY
          ls -lh samples
      - name: Upload raw voices
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: alt-tts-raw-v3
          path: samples/*.wav
          retention-days: 2
      - name: Publish artifact marker
        run: |
          printf 'run_id=%s\nartifact_id=%s\n' "$GITHUB_RUN_ID" '${{ steps.up.outputs.artifact-id }}' > alt_tts_v3_artifact_marker.txt
          git pull --rebase
          git add alt_tts_v3_artifact_marker.txt
          git commit -m 'Alt TTS v3 artifact marker [skip ci]' || true
          git push