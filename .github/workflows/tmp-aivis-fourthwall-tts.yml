name: Temporary Aivis fourth-wall narration
on:
  push:
    paths:
      - '.github/workflows/tmp-aivis-fourthwall-tts.yml'
permissions:
  contents: write
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          python -m pip install -q requests
      - name: Start AivisSpeech Engine
        run: |
          mkdir -p "$HOME/.local/share/AivisSpeech-Engine"
          docker pull ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          docker run --rm -d --name aivis_engine -p 10101:10101 \
            -v "$HOME/.local/share/AivisSpeech-Engine:/home/user/.local/share/AivisSpeech-Engine-Dev" \
            ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:10101/version >/dev/null 2>&1; then
              echo 'AivisSpeech Engine is ready'
              break
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:10101/version
      - name: Install high-quality Japanese male model
        run: |
          MODEL_UUID='47e53151-a378-46f3-abee-ce13aa07feb1'
          curl -fsS -X POST 'http://127.0.0.1:10101/aivm_models/install' \
            -F "url=https://api.aivis-project.com/v1/aivm-models/${MODEL_UUID}/download?model_type=AIVMX"
          echo
          curl -fsS http://127.0.0.1:10101/speakers > speakers.json
          python - <<'PY'
          import json
          d=json.load(open('speakers.json'))
          for s in d:
              if s.get('name')=='阿井田 茂':
                  print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - name: Synthesize corrected narration
        run: |
          cat > synthesize.py <<'PY'
          import json, os, wave, struct, time
          from pathlib import Path
          import requests

          base='http://127.0.0.1:10101'
          segs=json.load(open('tmp_aivis_segments.json',encoding='utf-8'))
          speakers=requests.get(base+'/speakers',timeout=30).json()
          target=next(s for s in speakers if s.get('name')=='阿井田 茂')
          styles=target['styles']
          calm=next((x for x in styles if x.get('name')=='Calm'), styles[0])
          speaker_id=calm['id']
          print('speaker:',target['name'],'style:',calm['name'],'id:',speaker_id)

          out=Path('aivis_out'); out.mkdir(exist_ok=True)
          timings=[]
          cursor=0.0
          wav_paths=[]

          def wav_duration(path):
              with wave.open(str(path),'rb') as w:
                  return w.getnframes()/w.getframerate()

          def make_silence(path, seconds=1.1, rate=44100):
              with wave.open(str(path),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
                  w.writeframes(b'\x00\x00'*int(rate*seconds))

          for i,item in enumerate(segs):
              display=item['display']; spoken=item['spoken']
              wav=out/f'{i:03d}.wav'
              if display=='……。':
                  make_silence(wav,1.15)
              else:
                  q=requests.post(base+'/audio_query',params={'speaker':speaker_id,'text':spoken},timeout=120)
                  q.raise_for_status(); query=q.json()
                  # Video-essay narration: clear, slightly brisk, restrained prosody.
                  query['speedScale']=1.08
                  query['intonationScale']=0.92
                  query['tempoDynamicsScale']=1.0
                  query['pitchScale']=0.0
                  query['volumeScale']=1.0
                  query['prePhonemeLength']=0.06
                  query['postPhonemeLength']=0.14
                  # Keep the exact pronunciation-directed text separate from subtitle text.
                  query['kana']=spoken
                  r=requests.post(base+'/synthesis',params={'speaker':speaker_id},json=query,timeout=180)
                  r.raise_for_status(); wav.write_bytes(r.content)
              dur=wav_duration(wav)
              timings.append({'index':i,'start':cursor,'end':cursor+dur,'duration':dur,'display':display,'spoken':spoken})
              cursor+=dur
              wav_paths.append(wav)
              print(i,round(dur,2),display[:30])

          concat=out/'concat.txt'
          concat.write_text(''.join("file '%s'\n"%p.name for p in wav_paths),encoding='utf-8')
          json.dump(timings,open(out/'timings.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          (out/'VOICE_INFO.txt').write_text(
              'Engine: AivisSpeech Engine\nModel: 阿井田 茂\nStyle: Calm\nArchitecture: Style-Bert-VITS2 (JP-Extra)\nModel UUID: 47e53151-a378-46f3-abee-ce13aa07feb1\nPronunciation: explicit spoken-text layer separate from subtitles\n',
              encoding='utf-8')
          print('total',cursor)
          PY
          python synthesize.py
          (cd aivis_out && ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i concat.txt -c:a pcm_s16le narration_aivis.wav)
          ffmpeg -y -hide_banner -loglevel error -i aivis_out/narration_aivis.wav -c:a aac -b:a 192k aivis_out/narration_aivis.m4a
          ls -lh aivis_out/narration_aivis.* aivis_out/timings.json
      - name: Upload narration artifact
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: fourthwall-aivis-narration
          path: |
            aivis_out/narration_aivis.m4a
            aivis_out/timings.json
            aivis_out/VOICE_INFO.txt
            tmp_aivis_segments.json
          retention-days: 2
      - name: Publish marker
        run: |
          printf 'run_id=%s\nartifact_id=%s\n' "$GITHUB_RUN_ID" '${{ steps.up.outputs.artifact-id }}' > aivis_fourthwall_marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aivis_fourthwall_marker.txt
          git commit -m 'Temporary Aivis narration marker [skip ci]' || true
          git push
