name: Temporary fourth wall narration TTS
on:
  push:
    paths:
      - '.github/workflows/tmp-fourthwall-tts.yml'
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install edge-tts
        run: python -m pip install -U edge-tts
      - name: Generate narration
        run: |
          mkdir -p tts_out
          edge-tts --voice ja-JP-KeitaNeural --rate=+18% --file tmp_fourthwall_narration.txt --write-media tts_out/narration.mp3 --write-subtitles tts_out/narration.srt
          ls -lh tts_out
      - name: Upload
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: fourthwall-narration
          path: tts_out
          retention-days: 2
      - name: marker
        run: |
          printf 'run_id=%s\nartifact_id=%s\n' "$GITHUB_RUN_ID" '${{ steps.up.outputs.artifact-id }}' > fourthwall_tts_marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fourthwall_tts_marker.txt
          git commit -m 'Temporary fourth wall TTS marker [skip ci]' || true
          git push
