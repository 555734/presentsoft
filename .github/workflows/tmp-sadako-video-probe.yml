name: Temporary Sadako video probe

on:
  push:
    paths:
      - '.github/workflows/tmp-sadako-video-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download TV-emergence scene
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            'https://idolfeatures.com/wp-content/uploads/2012/10/Ringu-Pure-Coming-Out-of-TV-Scene.mp4' \
            -o out/ringu_tv_emergence_source.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/ringu_tv_emergence_source.mp4 | tee out/PROBE.txt

      - name: Create half-second frames and contact sheets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/frames
          ffmpeg -hide_banner -loglevel error -i out/ringu_tv_emergence_source.mp4 \
            -vf "fps=2,scale=320:-1" out/frames/%03d.jpg
          ffmpeg -hide_banner -loglevel error -framerate 1 -i out/frames/%03d.jpg \
            -vf "tile=5x5" -frames:v 8 out/sheet_%02d.jpg || true

      - name: Upload probe
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sadako-tv-emergence-probe
          path: out
          retention-days: 2

      - name: Publish temporary run marker
        shell: bash
        run: |
          printf 'run_id=%s\nartifact_id=%s\n' "$GITHUB_RUN_ID" '${{ steps.upload.outputs.artifact-id }}' > sadako_probe_marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sadako_probe_marker.txt
          git commit -m 'Temporary Sadako TV probe marker [skip ci]' || true
          git push
