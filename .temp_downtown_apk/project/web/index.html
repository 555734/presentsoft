<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Downtown Walk</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc4e3;touch-action:none;font-family:system-ui,sans-serif}#game{position:absolute;inset:0;width:100%;height:100%;display:block}#hud{position:absolute;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.8}#cross:before,#cross:after{content:"";position:absolute;background:#fff;border-radius:2px;box-shadow:0 0 2px #000}#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{left:0;top:10px;width:22px;height:2px}.stick{position:absolute;bottom:7%;width:138px;height:138px;border:2px solid rgba(255,255,255,.28);border-radius:50%;background:rgba(0,0,0,.08);pointer-events:auto;touch-action:none}#move{left:5%}#look{right:5%}.nub{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(255,255,255,.09)}#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;max-width:80%;border-radius:12px;background:rgba(0,0,0,.62);color:#fff;font-size:14px;text-align:center;white-space:pre-wrap}#hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:7px 10px;border-radius:9px;background:rgba(0,0,0,.38);color:#fff;font-size:12px;white-space:nowrap;transition:opacity .5s}@media(max-height:420px){.stick{width:112px;height:112px;bottom:4%}.nub{width:46px;height:46px}#hint{top:8px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="cross"></div><div id="move" class="stick"><div class="nub"></div></div><div id="look" class="stick"><div class="nub"></div></div><div id="loading">街を読み込み中…</div><div id="hint">左：移動　右：視点</div></div><script src="bundle.js"></script></body></html>
